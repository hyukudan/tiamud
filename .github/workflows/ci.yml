name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check Rust advisories and dependency sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.93.1"
          command: check advisories sources

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Verify project license files
        run: bash scripts/verify-project-licenses.sh

      - name: Verify locked third-party notices and license policy
        run: node scripts/generate-third-party-notices.mjs --check

      - name: Verify and build web client
        working-directory: apps/web
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Install browser engines
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Test accessibility in Chromium, Firefox, and WebKit
        working-directory: apps/web
        run: pnpm e2e

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test soak acceptance verifier
        run: node --test scripts/verify-soak-report.test.mjs scripts/telnet-bot.test.mjs

      - name: Run transport smoke test
        run: node scripts/smoke.mjs

      - name: Run bounded headless load profile
        run: node scripts/load.mjs --users 16 --telnet-users 1 --rounds 2 --concurrency 4 --pace-ms 150 --max-rss-growth-mb 96

      - name: Retain a short soak-evidence profile
        run: |
          node scripts/soak.mjs \
            --binary target/debug/tiamud-server \
            --duration 30s \
            --warmup 5s \
            --sample-interval 5s \
            --users 2 \
            --telnet-users 1 \
            --concurrency 2 \
            --pace-ms 100 \
            --max-rss-growth-mb 96 \
            --report artifacts/soak-short.json

      - name: Upload short soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-short-${{ github.run_id }}
          path: artifacts/soak-short.json
          if-no-files-found: warn
          retention-days: 14
