     role="img"
     aria-labelledby="tiamud-icon-title tiamud-icon-description">
  <title id="tiamud-icon-title">Tiamud</title>
  <desc id="tiamud-icon-description">A hanging blue-glass lantern glowing inside an aged-gold diamond, kept within the maskable safe zone.</desc>

  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.52" r="0.5">
