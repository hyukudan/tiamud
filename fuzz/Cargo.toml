[package]
name = "tiamud-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[features]
default = ["libfuzzer"]
libfuzzer = ["libfuzzer-sys/link_libfuzzer"]

[dependencies]
envy-import = { path = "../tools/envy-import" }
libfuzzer-sys = { version = "=0.4.13", default-features = false }
serde_json = "=1.0.150"
tiamud-asset-pipeline = { path = "../crates/asset-pipeline", default-features = false }
tiamud-core = { path = "../crates/mud-core" }
tiamud-telnet-codec = { path = "../crates/telnet-codec" }
world-pack = { path = "../crates/world-pack" }

[[bin]]
name = "world_pack_document"
path = "fuzz_targets/world_pack_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envy_import"
path = "fuzz_targets/envy_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asset_manifest"
path = "fuzz_targets/asset_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "action_parser"
path = "fuzz_targets/action_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "telnet_parser"
path = "fuzz_targets/telnet_parser.rs"
test = false
doc = false
bench = false

# Keep the fuzz harness independent without changing the product workspace.
[workspace]
members = ["."]
